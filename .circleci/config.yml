version: 2.1

# The project remains canonical on GitHub. Tests use synthetic fixtures and
# fake model artifacts; no BigQuery credentials, production API keys, or deploy.
# Docker release/image compatibility jobs remain in the existing GitHub CI.
jobs:
  python-quality:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            # Invalidate when any nested pinned requirements set changes.
            - ms-capital-dev-pip-v2-{{ checksum "requirements-dev.txt" }}-{{ checksum "requirements-pipeline.txt" }}-{{ checksum "requirements.txt" }}
            - ms-capital-dev-pip-v2-
      - run:
          name: Install dev and test dependencies
          command: python -m pip install -r requirements-dev.txt
          no_output_timeout: 15m
      - save_cache:
          key: ms-capital-dev-pip-v2-{{ checksum "requirements-dev.txt" }}-{{ checksum "requirements-pipeline.txt" }}-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Ruff lint
          command: ruff check src/ api/ streamlit_app/ tests/ scripts/
      - run:
          name: Full project mypy
          command: mypy
      - run:
          name: Offline tests with coverage floor and timing evidence
          command: |
            mkdir -p test-results artifacts
            python -m pytest tests/ -q --maxfail=1 --cov --cov-report=term --cov-report=xml:artifacts/coverage.xml --junitxml=test-results/pytest.xml --durations=10
          no_output_timeout: 15m
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: junit
      - store_artifacts:
          path: artifacts/coverage.xml
          destination: coverage/coverage.xml

  dashboard-runtime:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - ms-capital-runtime-pip-v1-{{ checksum "requirements.txt" }}
            - ms-capital-runtime-pip-v1-
      - run:
          name: Install only production dashboard dependencies
          command: python -m pip install -r requirements.txt
          no_output_timeout: 15m
      - save_cache:
          key: ms-capital-runtime-pip-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Render every Streamlit page against runtime dependencies only
          command: python scripts/check_deploy.py
          no_output_timeout: 15m

workflows:
  verify:
    jobs:
      - python-quality
      - dashboard-runtime
