<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 890" width="1180" height="890" role="img" aria-label="MSCapital pipeline architecture">
<defs>
  <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#5B6979"/>
  </marker>
</defs>
<style>
  text { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .h { font-size: 26px; font-weight: 700; fill: #1B2430; }
  .t { font-size: 15px; font-weight: 600; fill: #1B2430; }
  .s { font-size: 13px; fill: #5B6979; }
  .a { font-size: 12px; fill: #5B6979; }
  .lbl { font-size: 12px; font-weight: 700; fill: #0F8C7A; letter-spacing: 1.2px; }
</style>
<rect width="1180" height="890" fill="#FFFFFF"/><text x="32" y="44" class="h">MSCapital — pipeline architecture</text><text x="32" y="68" class="s">Short-horizon return forecasting from market microstructure. Every box is code in this repository.</text><text x="32" y="108" class="lbl">INGEST</text><rect x="32" y="120" width="250" height="108" rx="8" fill="#FFFFFF" stroke="#C3CCD8" stroke-width="1.5"/><text x="46" y="144" class="t">Kaggle competition data</text><text x="46" y="164" class="s">804.5M rows · 9.26 GiB</text><text x="46" y="181" class="s">8 Arrow files, one record</text><text x="46" y="198" class="s">batch each</text><line x1="282" y1="174" x2="330" y2="174" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><rect x="330" y="120" width="250" height="108" rx="8" fill="#FFFFFF" stroke="#B4632A" stroke-width="1.5"/><text x="344" y="144" class="t">Column-group converter</text><text x="344" y="164" class="s">src/data/ingestion.py</text><text x="344" y="181" class="s">7.92 GB peak vs 11.53 GB needed</text><text x="344" y="198" class="s">on a 16 GB machine</text><line x1="580" y1="174" x2="628" y2="174" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><rect x="628" y="120" width="250" height="108" rx="8" fill="#FFFFFF" stroke="#C3CCD8" stroke-width="1.5"/><text x="642" y="144" class="t">Parquet shards → BigQuery</text><text x="642" y="164" class="s">src/data/bq_loader.py</text><text x="642" y="181" class="s">8 parallel workers</text><text x="642" y="198" class="s">row counts verified exactly</text><line x1="878" y1="174" x2="926" y2="174" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><rect x="926" y="120" width="222" height="108" rx="8" fill="#F1F5FA" stroke="#C3CCD8" stroke-width="1.5"/><text x="940" y="144" class="t">Staging</text><text x="940" y="164" class="s">partitioned by month,</text><text x="940" y="181" class="s">clustered by sample_id</text><text x="940" y="198" class="s">min(seconds) = 0 → no</text><text x="940" y="215" class="s">look-ahead</text><text x="32" y="276" class="lbl">FEATURES — aggregate per sample_id, then join</text><rect x="32" y="288" width="250" height="96" rx="8" fill="#F1F5FA" stroke="#C3CCD8" stroke-width="1.5"/><text x="46" y="312" class="t">Market · 114</text><text x="46" y="332" class="s">book shape, microprice,</text><text x="46" y="349" class="s">realised volatility</text><rect x="330" y="288" width="250" height="96" rx="8" fill="#F1F5FA" stroke="#C3CCD8" stroke-width="1.5"/><text x="344" y="312" class="t">Order · 81</text><text x="344" y="332" class="s">order-flow imbalance,</text><text x="344" y="349" class="s">cancellation rate</text><rect x="628" y="288" width="250" height="96" rx="8" fill="#F1F5FA" stroke="#C3CCD8" stroke-width="1.5"/><text x="642" y="312" class="t">Transaction · 52</text><text x="642" y="332" class="s">signed volume, Kyle's λ,</text><text x="642" y="349" class="s">Amihud illiquidity</text><line x1="157" y1="384" x2="157" y2="408" stroke="#5B6979" stroke-width="1.5"/><line x1="455" y1="384" x2="455" y2="408" stroke="#5B6979" stroke-width="1.5"/><line x1="753" y1="384" x2="753" y2="408" stroke="#5B6979" stroke-width="1.5"/><line x1="157" y1="408" x2="753" y2="408" stroke="#5B6979" stroke-width="1.5"/><line x1="455" y1="408" x2="455" y2="436" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><rect x="205" y="436" width="500" height="72" rx="8" fill="#FFFFFF" stroke="#0F8C7A" stroke-width="1.5"/><text x="219" y="460" class="t">Assembled feature table · 292 columns</text><text x="219" y="480" class="s">1,257,637 rows, one per sample · 264 distinct after the redundancy audit</text><line x1="455" y1="508" x2="455" y2="544" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><text x="32" y="572" class="lbl">VALIDATION</text><rect x="32" y="584" width="548" height="116" rx="8" fill="#FFFFFF" stroke="#0F8C7A" stroke-width="1.5"/><text x="46" y="608" class="t">Walk-forward, expanding window, 1-month embargo</text><text x="46" y="628" class="s">5 folds over months 0–64. The embargo cuts the overlap between</text><text x="46" y="645" class="s">consecutive 60 s windows, which a random split would leak across.</text><text x="46" y="662" class="s">Hold-out months 65–70 read ONCE. Primary metric: cosine similarity.</text><line x1="580" y1="642" x2="628" y2="642" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><rect x="628" y="584" width="520" height="116" rx="8" fill="#FFFFFF" stroke="#C3CCD8" stroke-width="1.5"/><text x="642" y="608" class="t">Models</text><text x="642" y="628" class="s">Ridge (median imputation) · LightGBM · XGBoost</text><text x="642" y="645" class="s">Blend weights fitted by cosine-optimal NNLS.</text><text x="642" y="662" class="s">Selection by cosine, never by the training loss.</text><text x="32" y="740" class="lbl">SERVING</text><rect x="32" y="752" width="355" height="96" rx="8" fill="#FFFFFF" stroke="#0F8C7A" stroke-width="1.5"/><text x="46" y="776" class="t">Artefact</text><text x="46" y="796" class="s">src/inference/ — loads without</text><text x="46" y="813" class="s">the training package</text><line x1="387" y1="800" x2="435" y2="800" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><rect x="435" y="752" width="340" height="96" rx="8" fill="#FFFFFF" stroke="#C3CCD8" stroke-width="1.5"/><text x="449" y="776" class="t">FastAPI</text><text x="449" y="796" class="s">/health /model-info /predict</text><text x="449" y="813" class="s">777 MB image</text><line x1="775" y1="800" x2="823" y2="800" stroke="#5B6979" stroke-width="1.5" marker-end="url(#h)"/><rect x="823" y="752" width="325" height="96" rx="8" fill="#FFFFFF" stroke="#C3CCD8" stroke-width="1.5"/><text x="837" y="776" class="t">Streamlit dashboard</text><text x="837" y="796" class="s">7 pages, published with the</text><text x="837" y="813" class="s">results bundled — no pipeline needed</text><text x="32" y="874" class="a">Generated by src/data/build_diagram.py — the feature counts are read from results/, so this cannot drift from the pipeline.</text>
</svg>
