name: Integration metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install requests==2.34.2
      - name: Verify Kaggle owner metadata using the existing repository token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python scripts/check_integrations.py --kaggle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-metadata
          path: .artifacts/integrations.json
