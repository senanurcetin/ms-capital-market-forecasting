name: Release images

# Publishes the api and dashboard images for a version (v1.2.3), started either way:
#   - push a v* tag, or
#   - run this workflow by hand (Actions -> Release images -> Run workflow) and give the version;
#     the workflow then creates the tag itself, on the head of main.
# Nothing runs on an ordinary push, and an image holds only code: no model, no data, no credentials.
#
# Either way, only a commit that is on main (and so went through CI) is published, and the version
# must look like v1.2.3 - a by-hand run cannot publish from another branch or under an arbitrary name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0 (the tag is created on the head of main)"
        required: true
        type: string

# Two runs for the same version must not race to create the tag or overwrite each other's images.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check the version and tag it
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the tag on a by-hand run; nothing else here writes
    outputs:
      version: ${{ steps.v.outputs.version }}
      plain: ${{ steps.v.outputs.plain }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history and every tag, for the ancestry and existing-tag checks

      # Inputs reach the shell through env, never interpolated into the script.
      - id: v
        name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            [ "$REF" = "refs/heads/main" ] \
              || { echo "::error::a by-hand release runs from main, not from $REF"; exit 1; }
          else
            version="$REF_NAME"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::'$version' is not a version like v1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "plain=${version#v}" >> "$GITHUB_OUTPUT"

      - name: The commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main; refusing to publish"; exit 1; }

      - name: Create the tag (by-hand runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if existing=$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}"); then
            [ "$existing" = "$GITHUB_SHA" ] \
              || { echo "::error::$VERSION already exists and points at $existing, not at $GITHUB_SHA"; exit 1; }
            echo "$VERSION already exists on this commit; publishing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
            echo "Created $VERSION on $GITHUB_SHA."
          fi

  images:
    name: Publish ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, app]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.plain }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A job of its own, after the images: if this fails the images are already published.
  release:
    name: Create the GitHub release
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the release; nothing else here writes
    steps:
      - uses: actions/checkout@v7

      # The notes are this version's section of CHANGELOG.md. A version with no section (a release
      # candidate, say) still gets a release, with a pointer instead of blank notes.
      - name: Release notes from the changelog
        env:
          PLAIN: ${{ needs.prepare.outputs.plain }}
        run: |
          set -uo pipefail
          python3 scripts/changelog_section.py "$PLAIN" > notes.md \
            || echo "No changelog section for $PLAIN; see the commit history." > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION already has a release; leaving it."
            exit 0
          fi
          flag=""
          case "$VERSION" in *-*) flag="--prerelease" ;; esac
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag $flag
