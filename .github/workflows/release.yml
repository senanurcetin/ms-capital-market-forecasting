name: Release images

# Publishes the api and dashboard images when a version tag is pushed (v1.2.3). Nothing runs on an
# ordinary push, and an image holds only code: no model, no data, no credentials.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, app]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can point anywhere. Only a commit that went through main (and so through CI) is
      # published.
      - name: Tag must be reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; refusing to publish"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
