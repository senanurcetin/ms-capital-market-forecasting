name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ api/ streamlit_app/ tests/ --line-length 100

      # The tests require NO live BigQuery and NO downloaded data: the ingest tests
      # generate a synthetic feather file and the API tests use a fake model artefact.
      # That is why CI needs no credentials.
      - name: Test
        run: pytest tests/ -q --maxfail=1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: mscapital:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - the slim API image must start without a model
        run: |
          docker run -d --name api -p 8000:8000 mscapital:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/h.json; then break; fi
            sleep 2
          done
          cat /tmp/h.json
          # Even with no model the service must be up and report "degraded"
          grep -q '"model_loaded": *false' /tmp/h.json
          docker rm -f api
