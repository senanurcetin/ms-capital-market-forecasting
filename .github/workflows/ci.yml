name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ api/ streamlit_app/ tests/ scripts/   # config in pyproject.toml

      # The modules that are clean today; the file set lives in pyproject.toml so CI and a local
      # `make typecheck` cannot disagree about what is checked.
      - name: Typecheck
        run: mypy

      # The tests require NO live BigQuery and NO downloaded data: the ingest tests
      # generate a synthetic feather file and the API tests use a fake model artefact.
      # That is why CI needs no credentials.
      - name: Test
        run: pytest tests/ -q --maxfail=1 --cov --cov-report=term   # floor in pyproject.toml

  # The dashboard is published on Streamlit Community Cloud, which installs
  # requirements.txt into an empty interpreter and runs `streamlit run`. Nothing above
  # tests that: the lint+test job installs requirements-dev.txt, which is a superset, so
  # a package missing from the runtime set passes CI and fails on deploy. That is exactly
  # how `background_gradient` (matplotlib, via pandas, at render time) reached production.
  deploy-env:
    name: Dashboard renders on the runtime deps alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pinned to what Streamlit Cloud is configured to use. A mismatch here would
          # make this job pass against wheels the deployment never sees.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the RUNTIME set only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render every page
        run: python scripts/check_deploy.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: false
          load: true
          tags: mscapital:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - the slim API image must start without a model
        run: |
          docker run -d --name api -p 8000:8000 mscapital:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/h.json; then break; fi
            sleep 2
          done
          cat /tmp/h.json
          # Even with no model the service must be up and report "degraded"
          grep -q '"model_loaded": *false' /tmp/h.json
          docker rm -f api

      # release.yml publishes this target too, so it must be known to build before a tag is the
      # first time anyone finds out it does not.
      - name: Build the dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The docker job above proves the slim image STARTS without a model. Nothing proved that a model
  # the TRAINING stack writes can be served by the SERVING stack - the two have different
  # dependency sets, and an artefact one can write and the other cannot read fails only on the
  # first live request. This builds a real artefact (the synthetic demo), mounts it into the api
  # image, and drives it over HTTP with the same script anyone can run against a local server.
  serve-e2e:
    name: Demo artefact served by the API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the training stack (the demo needs it)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train the demo model
        run: python -m src.demo --samples 2500 --root "$RUNNER_TEMP/demo"

      - uses: docker/setup-buildx-action@v4

      - name: Build the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: false
          load: true
          tags: mscapital:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Serve the artefact
        run: |
          docker run -d --name api -p 8000:8000 \
            -e MSCAPITAL_API_KEY=ci-key \
            -v "$RUNNER_TEMP/demo/models:/data/models:ro" mscapital:e2e

      - name: Drive it over HTTP
        run: python scripts/e2e_smoke.py http://localhost:8000 --api-key ci-key --wait 90

      - name: API logs
        if: failure()
        run: docker logs api
