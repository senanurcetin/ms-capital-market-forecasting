# Theme for the published dashboard. Streamlit Community Cloud reads this from the repo,
# so the deployed app looks the same as a local run rather than defaulting to whatever
# the viewer's browser happens to prefer.
#
# Both palettes are defined rather than only the dark one. `base` decides the default, but
# a reader who switches to light in Streamlit's own settings should get a designed page
# rather than the stock blue - and on a projector or a printout, light is the readable one.
#
# NEXUS 2.0 identity: midnight, cyan, blue, lavender and violet.
# Native light/dark surfaces remain authoritative, including the System theme choice.

[theme]
base = "dark"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
baseRadius = "medium"
showSidebarBorder = true

# Categorical sequence for st.bar_chart / st.line_chart when a frame has several columns.
# Ordered so the first two - the ones that carry the comparison in almost every chart here
# - are separable for the most common forms of colour blindness, rather than being two
# neighbouring hues.
chartCategoricalColors = [
    "#4C9AFF",  # blue      - the measurement
    "#F2A63B",  # amber     - the comparison
    "#00E0FF",  # cyan      - the accent
    "#B47CE6",  # violet
    "#E5698C",  # rose
    "#8FB339",  # olive
]

[theme.dark]
primaryColor = "#4EA8FF"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#061524"
textColor = "#E4EDF5"
linkColor = "#00E0FF"
borderColor = "#28394E"
dataframeHeaderBackgroundColor = "#061524"

[theme.light]
primaryColor = "#3156C8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1C2430"
linkColor = "#2851BD"
borderColor = "#DDE3EA"
dataframeHeaderBackgroundColor = "#F4F6F9"

[server]
# The dashboard reads committed result files; nothing is uploaded to it.
maxUploadSize = 1
enableStaticServing = false

[browser]
gatherUsageStats = false
