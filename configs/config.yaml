# MSCapital - Real Financial Market Forecasting
# Single source of truth for paths and constants.
# Code lives in the repo; data lives OUTSIDE it (see paths.data_root).

project:
  name: ms-capital-market-forecasting
  competition: ms-capital-real-financial-market-forecasting

paths:
  data_root: "C:/mscapital_data"
  raw: "C:/mscapital_data/raw"
  parquet: "C:/mscapital_data/parquet"
  features: "C:/mscapital_data/features"
  mlruns: "C:/mscapital_data/mlruns"

# Credential files are kept OUTSIDE the repo and can be overridden by env vars:
#   MSCAPITAL_GCP_KEY  or  GOOGLE_APPLICATION_CREDENTIALS
credentials:
  gcp_service_account: "C:/mscapital_data/gcp-key.json"
  kaggle_json: "~/.kaggle/kaggle.json"

bigquery:
  project: workintech-working
  location: US
  datasets:
    raw: mscapital_raw
    staging: mscapital_staging
    features: mscapital_features
    mart: mscapital_mart

# Exact row counts read from the Arrow footers - used to verify every ingest step.
expected_rows:
  train:
    market: 221756611
    order: 170056583
    transaction: 103970264
    label: 1257637
  test:
    market: 118359166
    order: 119465287
    transaction: 70909408
  submission: 647896

expected_bytes:
  train:
    market: 4396491768
    order: 1296050852
    transaction: 499265544
    label: 10012456
  test:
    market: 2497837624
    order: 906047012
    transaction: 337477704
  submission: 7015767

samples:
  train: 1257637   # sample_id 0..1257636
  test: 647896     # sample_id 0..647895  (SEPARATE id space!)
  months: 71       # month 0..70

# WINDOW LENGTHS DIFFER PER TABLE - measured over 1.26M samples:
#   market      : max 599.911 s -> 600 s (10 min); 1,257,631/1,257,637 samples exceed 60 s
#   order       : max  59.999 s ->  60 s
#   transaction : max  59.999 s ->  60 s
# seconds_before_predict counts BACKWARDS from the prediction instant and is
# sorted descending within a sample; 0 is the tick closest to prediction time.
#
# Market snapshot cadence: 176.3 rows / 600 s = one snapshot every ~3.4 s.
# A 1-second market window is therefore not used - it would be empty in ~71% of samples.
window:
  seconds:
    market: 600.0
    order: 60.0
    transaction: 60.0
  # Nested within-sample windows - the basis of the whole feature layer.
  nested:
    market: [5.0, 10.0, 30.0, 60.0, 120.0, 300.0, 600.0]
    order: [1.0, 5.0, 10.0, 30.0, 60.0]
    transaction: [1.0, 5.0, 10.0, 30.0, 60.0]

# order and transaction cap at EXACTLY 999 rows per sample (market peaks at 212, no cap).
# Capped samples therefore cover less than the full 60 s window. That is a data-quality
# signal, so it is encoded as a feature (ord_is_truncated / txn_is_truncated).
truncation:
  row_cap: 999
  tables: [order, transaction]

# Encodings resolved EMPIRICALLY from the data - not assumed.
#
# order table, over 170.1M events (prices are normalised around mid = 1.0):
#   side=0   mean price 0.9979 / 0.9943 (BELOW mid) -> BID
#   side=1   mean price 1.0036 / 1.0065 (ABOVE mid) -> ASK
#   action=0 128.1M (75%), close to mid               -> NEW
#   action=1  42.0M (25%), further out, larger size   -> CANCEL
#   Cross-check: NEW(128.1M) ~ CANCEL(42.0M) + TRANSACTION(104.0M)
#
# transaction table (aggressor side), verified against the prevailing market mid
# over 1.71M trades in month 0:
#   side=0  87.5% above mid, mean +5.26 bps -> BUY  (aggressor lifts the ask)
#   side=1  88.7% below mid, mean -5.27 bps -> SELL (aggressor hits the bid)
encoding:
  order_side:
    bid: 0
    ask: 1
  order_action:
    new: 0
    cancel: 1
  transaction_side:
    buy: 0
    sell: 1
    verified: true

ingestion:
  # market.feather is a SINGLE record batch (221.7M rows, 11.53 GB uncompressed),
  # so it is read one column group at a time and rejoined on row_id in BigQuery.
  parquet_row_group: 1000000
  rows_per_file: 5000000
  compression: zstd
  column_groups:
    market:
      g1: [sample_id, seconds_before_predict, transaction_avgprice, transaction_volume, transaction_count]
      g2: [sample_id, seconds_before_predict, ask_price_1, ask_volume_1, bid_price_1, bid_volume_1]
      g3: [sample_id, seconds_before_predict, ask_price_2, ask_volume_2, bid_price_2, bid_volume_2]
    order:
      g1: [sample_id, seconds_before_predict, price, volume, side, order_action]
    transaction:
      g1: [sample_id, seconds_before_predict, price, volume, side]

validation:
  # Walk-forward, expanding window, 1-month embargo between train and validation.
  # The embargo cuts leakage from overlapping lookback windows at the boundary.
  embargo_months: 1
  folds:
    - {train_end: 34, val_start: 36, val_end: 40}
    - {train_end: 40, val_start: 42, val_end: 46}
    - {train_end: 46, val_start: 48, val_end: 52}
    - {train_end: 52, val_start: 54, val_end: 58}
    - {train_end: 58, val_start: 60, val_end: 64}
  holdout: {start: 65, end: 70}   # UNTOUCHABLE - measured exactly once

mlflow:
  experiment: mscapital-forecasting
