  raw: "C:/mscapital_data/raw"
  parquet: "C:/mscapital_data/parquet"
  features: "C:/mscapital_data/features"
  mlruns: "C:/mscapital_data/mlruns"

# Kimlik dosyalari REPO DISINDA tutulur ve ortam degiskeniyle gecersiz kilinabilir:
#   MSCAPITAL_GCP_KEY  veya  GOOGLE_APPLICATION_CREDENTIALS
credentials:
  gcp_service_account: "C:/mscapital_data/gcp-key.json"
  kaggle_json: "~/.kaggle/kaggle.json"

bigquery:
  project: workintech-working
  location: US
  datasets:
    raw: mscapital_raw
    staging: mscapital_staging
    features: mscapital_features
    mart: mscapital_mart

# Arrow footer'dan olculen KESIN satir sayilari - ingest dogrulamasinda kullanilir
