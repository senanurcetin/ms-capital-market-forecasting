# Tool configuration lives here rather than in each command line, so that a local
# `ruff check` and the one CI runs cannot drift apart.
#
# Deliberately NOT a package manifest. Adding a [project] block made Streamlit
# Cloud report "more than one requirements file detected" and treat this as a
# poetry project - it still chose requirements.txt, but a build that has to pick
# between two manifests is one upgrade away from picking the wrong one.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "streamlit_app", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# SIM simplification, C4 comprehensions.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter setting above, not per-line
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Notebook builders hold long prose strings; tests re-import inside functions on
# purpose, to keep a slow import out of collection.
"notebooks/_build_*.py" = ["E501"]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # LightGBM and pyarrow emit deprecation noise that is not actionable here.
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src", "api"]
omit = [
    # Orchestration entry points: these drive live BigQuery jobs and multi-hour
    # training runs. Their pure logic is tested directly; their run() wrappers are
    # exercised by actually running the pipeline, not by unit tests.
    "src/data/test_pipeline.py",
    "src/data/mart.py",
]

[tool.coverage.report]
# A floor, not a target: measured 63% on 2026-10-05, and much of the gap is orchestration
# that drives live BigQuery jobs. It exists so coverage can only ratchet up.
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    'def main\(',
]

[tool.mypy]
# Typed where it is clean, and always on the serving surface, which answers requests and so
# cannot afford a type confusion that only shows up on the first live call. The modules
# listed in `exclude` still carry findings (34 at the time of writing, mostly untyped
# DataFrame and booster handling); they are left out rather than silenced with ignores, so
# fixing one and deleting its line from `exclude` is the whole procedure.
python_version = "3.11"
files = ["api", "src/inference", "src/config.py", "src/features", "src/evaluation"]
exclude = [
    "src/evaluation/drift\\.py",
    "src/evaluation/drift_robustness\\.py",
    "src/evaluation/cosine_decomposition\\.py",
]
explicit_package_bases = true
ignore_missing_imports = true
# A checked module that imports an unchecked one must not report the latter's findings.
follow_imports = "silent"
